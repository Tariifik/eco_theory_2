<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экономика: тема 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap">
<style>
:root{
  --bg:#eef1f5; --paper:#ffffff; --ink:#1b2433; --muted:#5d6a7e; --line:#d5dce6;
  --accent:#2f5bd3; --accent-soft:#e3eafc; --ok:#1f8a5b; --ok-soft:#dff3e9; --warn:#b4532a; --warn-soft:#fbe9df;
  --hint:#7a5a00; --hint-soft:#fff4cf; --block:#f6f8fb;
  --display:"Literata",Georgia,serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1b212b; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2c3543;
  --accent:#7d9cff; --accent-soft:#232f4d; --ok:#5fd09a; --ok-soft:#173327; --warn:#f0946a; --warn-soft:#3a2219;
  --hint:#f2cf63; --hint-soft:#33290d; --block:#161b24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1b212b; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2c3543;
  --accent:#7d9cff; --accent-soft:#232f4d; --ok:#5fd09a; --ok-soft:#173327; --warn:#f0946a; --warn-soft:#3a2219;
  --hint:#f2cf63; --hint-soft:#33290d; --block:#161b24; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-weight:650;font-size:1.6rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.9rem;font-weight:500;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0d1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0d1220}}
button:focus-visible,input:focus-visible,.blank:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--ok);width:0;transition:width .3s}
.ptext{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;padding:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 20px;min-height:260px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(20,30,60,.35);cursor:pointer;position:relative}
.card.noclick{cursor:default}
.tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.q{font-family:var(--display);font-weight:650;font-size:1.45rem;line-height:1.25;text-wrap:balance;margin:0}
.meta{color:var(--muted);font-size:.9rem;margin:-6px 0 0}
.meta b{color:var(--ink);font-weight:600}
.tapnote{margin-top:auto;color:var(--muted);font-size:.85rem}
.blocks{display:flex;flex-direction:column;gap:10px}
.blk{border:1px solid var(--line);background:var(--block);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.blk.closed{border-style:dashed;color:var(--muted);font-size:.9rem;background:transparent}
.bh{font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.src{font-size:.8rem;color:var(--muted);font-style:italic}
.pt{margin:0;font-size:1.02rem;line-height:1.6;padding-left:14px;position:relative}
.pt::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.55}
.pt.new{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pt.ph{color:var(--muted);font-size:.88rem;border-bottom:2px dashed var(--line);padding-bottom:2px;width:fit-content}
.pt.ph::before{background:var(--line);opacity:1}
.pt b,.a b{background:var(--accent-soft);color:var(--ink);font-weight:600;padding:0 3px;border-radius:4px}
.mn{background:var(--hint-soft);color:var(--hint);border-radius:10px;padding:10px 12px;font-size:.92rem}
.mn strong{font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;font-size:1rem;padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.again{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.know{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
:root[data-theme="dark"] .btn.primary{color:#0d1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1220}}
.btn.ghost{background:transparent}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px dashed var(--accent);color:transparent;cursor:pointer;border-radius:4px;padding:0 3px;user-select:none;background:var(--accent-soft)}
.blank.open{color:var(--ink);border-bottom-style:solid;background:var(--ok-soft);user-select:auto}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.done .q{font-size:1.3rem}
.search{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item h3{margin:0;font-family:var(--display);font-weight:650;font-size:1.1rem}
.item .pt{font-size:.97rem}
.item .pt b{background:none;padding:0;color:var(--accent)}
.item .mn{font-size:.85rem;padding:7px 10px}
.item .blk{padding:10px 12px}
.empty{color:var(--muted);text-align:center;padding:20px}
.tips{font-size:.88rem;color:var(--muted);margin:0}
.jump{font:inherit;font-size:.9rem;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
@media (max-width:440px){.q{font-size:1.25rem}.seg button{padding:6px 9px}.card{padding:18px 14px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}.pt.new{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Экономика: тема 2 — рынок, товар, деньги</h1>
    <p class="sub">52 пункта из файла. У каждого термина столько определений, сколько дано в файле, и каждое открывается по смысловым частям. Ключевые слова выделены.</p>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Режим">
      <button data-mode="cards">Карточки</button>
      <button data-mode="cloze">Пропуски</button>
      <button data-mode="list">Шпаргалка</button>
    </div>
    <div class="seg" role="group" aria-label="Раздел">
      <button data-v="1">Рынок</button>
      <button data-v="2">Благо и товар</button>
      <button data-v="3">Деньги</button>
      <button data-v="0">Всё</button>
    </div>
  </div>

  <section id="view"></section>
</div>

<script>
/*
  s — раздел (1 рынок, 2 благо/товар/услуга, 3 деньги), n — номер в файле, t — вопрос,
  u — как называть блок ответа, d — блоки: [заголовок, источник, часть1, часть2, ...]
  [ ] — ключевые слова, m — подсказка для запоминания
*/
const SEC={1:"Рынок",2:"Благо, товар, услуга",3:"Деньги"};
const D=[
{s:1,n:1,t:"Важнейшие условия возникновения рынка",u:"Список",d:[
 ["4 условия","",
  "[Общественное разделение труда] и [специализация] труда",
  "[Частная собственность]",
  "[Экономическая обособленность], или экономическая автономия",
  "[Свободный обмен] ресурсами, экономическими благами"]],
 m:"«РСОО»: Разделение труда → Собственность → Обособленность → Обмен."},

{s:1,n:2,t:"Товарное производство",u:"Определение",d:[
 ["","",
  "такой [тип организации хозяйства],",
  "при котором блага, продукты [создаются для продажи] их [на рынке]"]],
 m:"Производят не для себя, а на продажу."},

{s:1,n:3,t:"Типы товарного производства",u:"Тип",d:[
 ["Простое товарное производство","",
  "[исторически первый] тип товарного производства,",
  "при котором применяется [личный труд] собственников факторов производства"],
 ["Развитое товарное производство","",
  "[наивысшая, развитая форма] товарного производства, достигается [при капитализме],",
  "при котором применяется [наёмный труд]"]],
 m:"Простое — работаю сам. Развитое — нанимаю других."},

{s:1,n:4,t:"Рынок (5 определений)",u:"Определение",d:[
 ["Определение 1","",
  "это [общественная форма организации экономики],",
  "[система отношений обмена], основанных на использовании [товарно-денежных отношений]",
  "и устанавливающих [непосредственные связи между производителями и потребителями]"],
 ["Определение 2","",
  "это многосложная сфера, [экономический механизм взаимодействия]",
  "[производителей (продавцов)] и [потребителей (покупателей)] товаров и услуг,",
  "осуществляемого через механизмы [ценообразования, конкуренции, спроса и предложения]"],
 ["Определение 3","",
  "это [тип хозяйственных связей]",
  "между [экономическими субъектами]"],
 ["Определение 4","",
  "это [место, где определяется цена],",
  "являющаяся [главным индикатором] рыночной экономики"],
 ["Определение 5","",
  "это [особая экономическая категория],",
  "её [не следует путать с торговлей]: торговля — [отрасль экономики]"]],
 m:"Пять «это»: форма организации → механизм взаимодействия → тип связей → место цены → категория (≠ торговля)."},

{s:1,n:5,t:"Принципиальные основы рыночной экономики",u:"Список",d:[
 ["7 основ","",
  "[Частная собственность] на инвестиционные ресурсы",
  "[Свобода в принятии экономических решений] (свобода предпринимательства)",
  "[Приоритет личного интереса] над общественным (индивидуализм)",
  "Наличие [свободной конкуренции] — механизма, обеспечивающего равенство прав производителей и потребителей, а также баланс между интересами личности и общества",
  "Опора на [механизм саморегуляции] (в основе — система взаимной адаптации субъектов рынка)",
  "[Социальное неравенство]: выигрывают, как правило, наиболее активные субъекты; не обладающие должным потенциалом остаются в проигрыше",
  "[Рыночная направленность деятельности государства] (осуществляет коррекцию рыночных издержек)"]],
 m:"Собственность, Свобода, Свой интерес, Конкуренция, Саморегуляция, Неравенство, Государство."},

{s:1,n:6,t:"Элементы рыночного механизма",u:"Список",d:[
 ["4 элемента","","[Спрос]","[Предложение]","[Цена]","[Конкуренция]"]],
 m:"«СПЦК»: Спрос, Предложение, Цена, Конкуренция."},

{s:1,n:7,t:"Функции рынка",u:"Список",d:[
 ["6 функций","","[Ценообразующая]","[Посредническая]","[Информационная], коммуникативная","[Санирующая]","[Распределительная]","[Регулирующая]"]],
 m:"«ЦПИ-СРР»: Цена, Посредник, Информация, Санация (оздоровление), Распределение, Регулирование."},

{s:1,n:8,t:"Преимущества рынка",u:"Список",d:[
 ["7 преимуществ","",
  "Функционирование механизма [конкуренции]",
  "Высокая способность к [оперативному удовлетворению] разнообразных потребностей людей, [ликвидации дефицитов], повышению качества товаров и услуг",
  "[Свобода предпринимательства], выбора и действий потребителей и производителей",
  "[Эффективное распределение ресурсов] в соответствии с потребностями общества",
  "[Гибкость] и высокая [адаптивность] к изменяющимся условиям",
  "Максимальное использование достижений и [стимулирование научно-технического прогресса]",
  "[Невозможность хронического дефицита]: неудовлетворённый спрос ведёт к росту цен и повышает выгодность вложения средств именно в производство дефицитных продуктов, тем самым снимая проблему дефицита"]],
 m:"Конкуренция, Быстрота, Свобода, Эффективность, Гибкость, Прогресс, Нет дефицита. В файле опечатка «научно-механического процесса»."},

{s:1,n:9,t:"Недостатки (отрицательные черты, фиаско, сбои, провалы, срывы) рынка",u:"Список",d:[
 ["11 недостатков","",
  "Не способен противостоять [монополистическим тенденциям]: порождает монополию, способствует ослаблению конкуренции",
  "Не способен устранить [внешние (побочные) эффекты], слабо сохраняет невоспроизводимые ресурсы, плохо [охраняет окружающую среду]",
  "Ориентирован прежде всего на [индивидуальные потребности]; общественные учитывает плохо или не учитывает; [не способен производить общественные блага] («общественные товары»)",
  "[Нестабильность, неравновесие] развития с производственными и социальными потерями, снижение эффективности — «созидательное разрушение»; [безработица, инфляция]",
  "[Расточительное], нерациональное и неэффективное производство и использование ресурсов",
  "Не способен обеспечить [социальные гарантии], социальную справедливость в обществе",
  "[Неравномерно распределяет доходы] в соответствии с вложенными факторами производства",
  "Ведёт к [социальному расслоению], социальной дифференциации нации, усилению социальной напряжённости",
  "Порождает [неполную и несвоевременную информацию]",
  "Мощное [информационное и психологическое воздействие на потребителя], на его самостоятельность в принятии потребительских решений",
  "[Игнорирует] соблюдение правил и норм поведения в обществе, [социальные и этические критерии]"]],
 m:"Группы: монополия и экология → общество и нестабильность → ресурсы → неравенство (гарантии, доходы, расслоение) → информация и давление → этика."},

{s:1,n:10,t:"Виды рынков",u:"Критерий",d:[
 ["Критерии и виды","",
  "По [экономическому назначению объектов]: рынки товаров и услуг, труда (рабочей силы), капитала, научно-технических разработок, земли, ценных бумаг, валюты и т.п.",
  "По [товарным группам]: рынки товаров производственного назначения, потребительских товаров, факторов производства",
  "По [территориальному] (пространственному, географическому) признаку: местные, региональные, национальные, внутренние, общенациональные, мировые",
  "По [степени развитости и ограничения конкуренции]: совершенной конкуренции, монополистической конкуренции, олигопольный, монопсонический, смешанный",
  "По [характеру продаж]: оптовой торговли, розничной торговли, государственных закупок",
  "По [соблюдению законности]: легальные, нелегальные, «теневые», «чёрные»",
  "По [отраслям]: автомобильный, зерна, нефти и другие",
  "По [степени участия государства]: стихийные и регулируемые",
  "По [уровню насыщения]: равновесный, дефицитный, избыточный",
  "По [организационной структуре]: открытый, закрытый, преференциальный"]],
 m:"10 критериев: Назначение, Товары, Территория, Конкуренция, Продажи, Закон, Отрасль, Государство, Насыщение, Структура."},

{s:1,n:11,t:"Два типа рынка",u:"Тип",d:[
 ["Рынок продавца","",
  "[Спрос больше предложения], ситуация [дефицита]",
  "Активный «деятель» рынка — [покупатель]",
  "[Продавец диктует] свои условия"],
 ["Рынок покупателя","",
  "[Предложение больше спроса]",
  "Активный «деятель» рынка — [продавец]",
  "Продавец [ищет покупателя], готов его обслужить"]],
 m:"Чей рынок — тот и командует. Рынок продавца = дефицит, бегает покупатель."},

{s:1,n:12,t:"Субъекты рынка",u:"Определение",d:[
 ["","",
  "[физические и юридические лица],",
  "вступающие в экономические отношения [товарообмена и услуг]",
  "в одних случаях [как потребители], в других — [как производители]",
  "([домашние хозяйства, фирмы, государство])"]],
 m:"Субъект = кто действует: семья, фирма, государство."},

{s:1,n:13,t:"Объекты рынка",u:"Определение",d:[
 ["","",
  "[специфические группы товаров и услуг],",
  "имеющие [устойчивый спрос], [стабильно поступающие] на рынок",
  "и развивающиеся по характеру, способу и целям потребителя",
  "([товары и услуги], [факторы производства] (труд, земля, средства производства), [деньги], [ценные бумаги], субсидии, социальные выплаты)"]],
 m:"Объект = что продают и покупают."},

{s:1,n:14,t:"Юридическое лицо",u:"Признак",d:[
 ["Это организация, которая","Гражданский кодекс РФ, ст. 48",
  "имеет в собственности, хозяйственном ведении или оперативном управлении [обособленное имущество]",
  "[отвечает по своим обязательствам] своим обособленным имуществом",
  "может от своего имени [приобретать и осуществлять] имущественные и личные неимущественные [права]",
  "[несёт обязанности]",

const $=s=>document.querySelector(s);
const view=$("#view");
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let known=new Set(load("econ2-known",[]));
let st={mode:load("econ2-mode","cards"),v:load("econ2-v",1)};
let queue=[],pos=0,shown=0,clozeIdx=0,q="";

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const bold=s=>esc(s).replace(/\[([^\]]+)\]/g,"<b>$1</b>");
const blanks=s=>esc(s).replace(/\[([^\]]+)\]/g,(m,w)=>`<span class="blank" tabindex="0" role="button" aria-label="Показать слово">${w}</span>`);
const deck=()=>D.filter(c=>st.v==0||c.s==st.v);
const total=c=>c.d.reduce((a,b)=>a+b.length-2,0);
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+" "+(m==1&&h!=11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};
const defCount=c=>c.d.length;

function head(c,i){
  const b=c.d[i];
  let h=b[0]||(c.d.length>1?`${c.u} ${i+1}`:"");
  return (h?`<span class="bh">${esc(h)}</span>`:"")+(b[1]?`<span class="src">${esc(b[1])}</span>`:"");
}
function metaLine(c){
  const T=total(c),n=c.d.length;
  if(c.u=="Определение"&&n>1) return `<b>${plural(n,"определение","определения","определений")}</b> · ${plural(T,"часть","части","частей")}`;
  if(n>1) return `<b>${n}</b> ${n<5&&n>1?"блока":"блоков"} · ${plural(T,"часть","части","частей")}`;
  return plural(T,"часть","части","частей");
}

// Карточка: части открываются по одной, блоки (определения) — по порядку
function blocksHTML(c,upto,fresh){
  let k=0,out="";
  c.d.forEach((b,i)=>{
    const parts=b.slice(2),start=k;k+=parts.length;
    if(upto<=start){
      out+=`<div class="blk closed">${c.d.length>1?`${esc(c.u)} ${i+1} из ${c.d.length}`:"Ответ"} · ${plural(parts.length,"часть","части","частей")} — нажми, чтобы открыть</div>`;
      return;
    }
    out+=`<div class="blk">${head(c,i)}`;
    parts.forEach((p,j)=>{
      const idx=start+j;
      out+= idx<upto ? `<p class="pt${idx==fresh?" new":""}">${bold(p)}</p>` : `<p class="pt ph">часть ${j+1}</p>`;
    });
    out+=`</div>`;
  });
  return out;
}

function buildQueue(){queue=deck().filter(c=>!known.has(c.n));pos=0;shown=0}
function setBtns(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode==st.mode));
  document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==st.v));
}
function progress(){
  const d=deck(),k=d.filter(c=>known.has(c.n)).length;
  return `<div class="progress"><div class="track"><div class="fill" style="width:${d.length?k/d.length*100:0}%"></div></div>
  <div class="ptext"><span>Запомнено ${k} из ${d.length}</span><button class="link" id="reset">Начать заново</button></div></div>`;
}
function render(){
  setBtns();
  if(st.mode=="cards")renderCards();else if(st.mode=="cloze")renderCloze();else renderList();
  const r=$("#reset");if(r)r.onclick=()=>{deck().forEach(c=>known.delete(c.n));save("econ2-known",[...known]);buildQueue();render()};
}

function renderCards(fresh){
  if(!queue.length){
    view.innerHTML=progress()+`<div class="card noclick done" style="margin-top:14px"><p class="q">Все карточки раздела отмечены как выученные</p>
    <p class="tips">Проверь себя в режиме «Пропуски» или нажми «Начать заново».</p></div>`;return;
  }
  const c=queue[pos],T=total(c),all=shown>=T;
  view.innerHTML=progress()+`<div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
   <div class="card${all?" noclick":""}" id="card" tabindex="0" role="button" aria-label="Открыть следующую часть">
    <span class="tag">${SEC[c.s]} · № ${c.n} · осталось ${queue.length}</span>
    <p class="q">${esc(c.t)}</p>
    <p class="meta">${metaLine(c)}${shown?` · открыто ${shown}/${T}`:""}</p>
    <div class="blocks">${blocksHTML(c,shown,fresh)}</div>
    ${all?`<div class="mn"><strong>Как запомнить:</strong> ${esc(c.m)}</div>`
      :`<p class="tapnote">${shown?"Вспомни следующую часть и нажми на карточку (или пробел).":"Сначала проговори ответ сам, потом открывай по частям — нажатием на карточку или пробелом."}</p>`}
   </div>
   ${all?`<div class="actions"><button class="btn again" id="again">Ещё раз</button><button class="btn know" id="know">Помню</button></div>`
     :`<div class="actions"><button class="btn ghost" id="allp">Показать всё</button><button class="btn primary" id="nextp">Следующая часть</button></div>
       <button class="link" id="skip" style="align-self:center">Пропустить карточку</button>`}
  </div>`;
  const step=()=>{if(shown<T){shown++;renderCards(shown-1)}};
  $("#card").onclick=step;
  if(all){
    $("#know").onclick=()=>{known.add(c.n);save("econ2-known",[...known]);queue.splice(pos,1);if(pos>=queue.length)pos=0;shown=0;renderCards()};
    $("#again").onclick=()=>{queue.splice(pos,1);queue.splice(Math.min(pos+3,queue.length),0,c);shown=0;renderCards()};
  }else{
    $("#nextp").onclick=e=>{e.stopPropagation();step()};
    $("#allp").onclick=()=>{shown=T;renderCards()};
    $("#skip").onclick=()=>{queue.push(queue.splice(pos,1)[0]);shown=0;renderCards()};
  }
}

function renderCloze(){
  const d=deck();if(clozeIdx>=d.length)clozeIdx=0;const c=d[clozeIdx];
  view.innerHTML=`<div class="bar" style="justify-content:space-between"><p class="tips">Вспомни слово, потом нажми на пропуск.</p>
   <select class="jump" id="jump" aria-label="Перейти к пункту">${d.map((x,i)=>`<option value="${i}"${i==clozeIdx?" selected":""}>№ ${x.n}. ${esc(x.t)}</option>`).join("")}</select></div>
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">
   <div class="card noclick"><span class="tag">${SEC[c.s]} · № ${c.n} · ${clozeIdx+1} из ${d.length}</span>
    <p class="q">${esc(c.t)}</p><p class="meta">${metaLine(c)}</p>
    <div class="blocks">${c.d.map((b,i)=>`<div class="blk">${head(c,i)}${b.slice(2).map(p=>`<p class="pt">${blanks(p)}</p>`).join("")}</div>`).join("")}</div>
    <div class="mn"><strong>Подсказка:</strong> ${esc(c.m)}</div>
   </div>
   <div class="actions"><button class="btn ghost" id="prev">Назад</button><button class="btn" id="all">Открыть всё</button></div>
   <button class="btn know" id="next">Дальше</button>
  </div>`;
  view.querySelectorAll(".blank").forEach(b=>{const o=()=>b.classList.add("open");b.onclick=o;b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();o()}}});
  $("#all").onclick=()=>view.querySelectorAll(".blank").forEach(b=>b.classList.add("open"));
  $("#next").onclick=()=>{clozeIdx=(clozeIdx+1)%d.length;renderCloze()};
  $("#prev").onclick=()=>{clozeIdx=(clozeIdx-1+d.length)%d.length;renderCloze()};
  $("#jump").onchange=e=>{clozeIdx=+e.target.value;renderCloze()};
}

function renderList(){
  view.innerHTML=`<input class="search" id="search" type="search" placeholder="Поиск: рынок, услуга, мультипликатор…" value="${esc(q)}">
  <div class="list" id="lst" style="margin-top:12px"></div>`;
  const draw=()=>{
    const t=q.trim().toLowerCase();
    const items=deck().filter(c=>!t||(c.t+" "+c.d.flat().join(" ")).toLowerCase().includes(t));
    $("#lst").innerHTML=items.length?items.map(c=>`<article class="item"><span class="tag">${SEC[c.s]} · № ${c.n} · ${metaLine(c).replace(/<[^>]+>/g,"")}</span>
      <h3>${esc(c.t)}</h3>${c.d.map((b,i)=>`<div class="blk">${head(c,i)}${b.slice(2).map(p=>`<p class="pt">${bold(p)}</p>`).join("")}</div>`).join("")}
      <div class="mn">${esc(c.m)}</div></article>`).join("")
      :`<p class="empty">Ничего не найдено. Попробуй другое слово.</p>`;
  };
  $("#search").oninput=e=>{q=e.target.value;draw()};draw();
}

document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;save("econ2-mode",st.mode);shown=0;render()});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{st.v=+b.dataset.v;save("econ2-v",st.v);clozeIdx=0;buildQueue();render()});
document.addEventListener("keydown",e=>{
  if(st.mode!="cards"||!queue.length||/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;
  if(e.key==" "||e.key=="Enter"){e.preventDefault();const c=queue[pos];if(shown<total(c)){shown++;renderCards(shown-1)}}
});
buildQueue();render();
</script>
</body>
</html>
